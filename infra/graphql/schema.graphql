"""
On-Connect チャット機能（5.2）GraphQLスキーマ
リアルタイム配信（新着メッセージ・既読）は Subscription で実現する。
"""

type ChatRoom {
  roomId: ID!
  isGroup: Boolean!
  name: String
  memberUserIds: [ID!]!
  createdAt: AWSDateTime!
}

enum MessageStatus {
  scheduled
  sent
}

"""絵文字リアクション（Phase 9。掲示板投稿の`Reaction`型と同じ形、REST側はpackages/sharedの型定義を共有）"""
type Reaction {
  emoji: String!
  userIds: [ID!]!
}

type Message {
  messageId: ID!
  roomId: ID!
  senderId: ID!
  body: String!
  attachmentKeys: [String!]
  readByUserIds: [ID!]!
  status: MessageStatus!
  scheduledAt: AWSDateTime
  """緊急通知フラグ：通知OFFのユーザーにも強制配信する（音声通話には適用しない）"""
  forceNotify: Boolean!
  """グループチャットでのメンション先。指定時は名指しされた人にのみ通知が届く（forceNotifyが優先）"""
  mentionedUserIds: [ID!]
  reactions: [Reaction!]
  createdAt: AWSDateTime!
}

input SendMessageInput {
  roomId: ID!
  senderId: ID!
  body: String!
  attachmentKeys: [String!]
  """指定時に予約送信（5.2.2）。未指定なら即時送信。"""
  scheduledAt: AWSDateTime
  """緊急通知として送信するか（管理者ロール等の限定権限、5.2.3）"""
  forceNotify: Boolean
  """メンション先ユーザーID一覧（Phase 5）"""
  mentionedUserIds: [ID!]
}

input MarkReadInput {
  roomId: ID!
  messageId: ID!
  userId: ID!
}

input CreateRoomInput {
  isGroup: Boolean!
  name: String
  memberUserIds: [ID!]!
}

input ToggleReactionInput {
  roomId: ID!
  messageId: ID!
  emoji: String!
  userId: ID!
}

type Query {
  getChatRoom(roomId: ID!): ChatRoom
  listMessagesForRoom(roomId: ID!, limit: Int, nextToken: String): [Message!]!
  """自分が参加しているルーム一覧を取得する（ChatRoomsTableを全件スキャンしフィルタする、Phase 8d）"""
  listChatRoomsForUser(userId: ID!): [ChatRoom!]!
}

type Mutation {
  sendMessage(input: SendMessageInput!): Message!
  markMessageRead(input: MarkReadInput!): Message!
  cancelScheduledMessage(roomId: ID!, messageId: ID!): Message!
  """1対1・グループ問わずルームを新規作成する（Phase 8d）"""
  createRoom(input: CreateRoomInput!): ChatRoom!
  """絵文字リアクションのトグル（Phase 9）。read-modify-writeが必要なためLambdaリゾルバで処理する"""
  toggleMessageReaction(input: ToggleReactionInput!): Message!
  """
  予約送信メッセージの配信トリガー（Phase 10）。sendScheduled.tsがEventBridge Schedulerから
  起動された際、Messagesテーブルの直接UpdateItemでstatusを更新した後、IAM署名付きでこの
  ミューテーションを呼び出す。実体は単純なGetItem（再更新はしない）で、onMessageSent購読を
  発火させてチャットルームへリアルタイム配信するためだけに存在する
  """
  deliverScheduledMessage(roomId: ID!, messageId: ID!): Message!
}

type Subscription {
  onMessageSent(roomId: ID!): Message
    @aws_subscribe(mutations: ["sendMessage", "deliverScheduledMessage"])
  onMessageRead(roomId: ID!): Message
    @aws_subscribe(mutations: ["markMessageRead"])
  onMessageReactionChanged(roomId: ID!): Message
    @aws_subscribe(mutations: ["toggleMessageReaction"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
